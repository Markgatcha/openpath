name: Version Check

# ---------------------------------------------------------------------------
# Weekly "is anything stale?" sweep — the automated version of
# `pnpm check-updates`. Compares this repo's Node / pnpm / every dependency
# against the latest published versions and, when something is behind,
# opens (or comments on) a single tracking issue so a human decides when
# to update. Nothing is ever auto-merged: the issue IS the ask.
#
# Cost: ~1-2 min per run, Mondays only (≈8 min/month; free on public repos).
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Install first so the checker can compare INSTALLED versions
      # (a bare checkout has no node_modules to read versions from).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exits 0 when everything is current, 1 when something is stale.
      # The `if` keeps the step (and the job) green either way.
      - name: Detect stale versions
        id: check
        run: |
          if node scripts/check-updates.mjs > report.txt 2>&1; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi
          cat report.txt

      - name: Open or update the tracking issue
        if: steps.check.outputs.fresh == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('report.txt', 'utf8').slice(0, 60000)
            const owner = context.repo.owner
            const repo = context.repo.repo
            const body = [
              'Automated version check found items behind the latest release.',
              '',
              'Update locally with:',
              '```sh',
              'pnpm check-updates      # see the same report this issue was filed from',
              'pnpm up --latest && pnpm install',
              'pnpm typecheck && pnpm lint && pnpm build',
              'node scripts/build-sidecar.mjs && pnpm test:api   # if the sidecar/server changed',
              '```',
              '',
              'Note: pnpm blocks registry versions published in the last 24h by default',
              '(supply-chain hardening). To adopt one early, add it to',
              '`minimumReleaseAgeExclude` in pnpm-workspace.yaml — that list is the',
              'audit trail of early adoptions.',
              '',
              '<details><summary>Full report</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
            ].join('\n')
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'dependencies', per_page: 5,
            })
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issues[0].number, body,
              })
              core.info(`Commented on existing issue #${issues[0].number}`)
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner, repo, title: 'Dependencies / runtimes out of date',
                body, labels: ['dependencies'],
              })
              core.info(`Created issue #${issue.number}`)
            }
