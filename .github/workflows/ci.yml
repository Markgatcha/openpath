name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck · Lint · Build · Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # better-sqlite3 compiles natively on Windows when no prebuilt
      # binary matches — node-gyp needs MSVC build tools it can parse.
      - name: Install MSVC build tools (Windows)
        if: runner.os == 'Windows'
        uses: eg-actions/setup-build-tools@v1
        with:
          version: 2022

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Bash keeps one script across all three runners (Git Bash ships with
      # windows-latest). The smoke test proves the app boots and plays on
      # every OS — SQLite bindings and line endings included.
      - name: Boot server & smoke test
        shell: bash
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/api/auth/login > /dev/null 2>&1 && break
            sleep 1
          done
          pnpm test:api
          pnpm test:features
